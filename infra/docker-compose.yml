# Local demo stack. Run from the repo root:
#   docker compose -f infra/docker-compose.yml up --build
# App: http://localhost:8080   Prometheus: http://localhost:9090   Grafana: http://localhost:3000 (admin / admin)

services:
  app:
    build:
      context: ..
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      DB_HOST: postgres
      DB_PASSWORD: callseal
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: callseal
      POSTGRES_USER: callseal
      POSTGRES_PASSWORD: callseal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callseal"]
      interval: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
